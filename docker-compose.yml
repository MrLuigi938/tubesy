# Tubesy – docker compose up -d
# Your own values are best kept in a .env file next to this one (template: .env.example).
# Without .env the defaults after ":-" apply.
# Guide: https://github.com/MrLuigi938/tubesy/blob/main/docs/en/docker-compose.md

services:
  tubesy:
    # latest = newest stable version, 1.0 = newest 1.0.x, edge = development state
    image: ghcr.io/mrluigi938/tubesy:${TUBESY_VERSION:-latest}
    container_name: tubesy
    restart: unless-stopped
    # Remove this block if Tubesy should only be reachable through a reverse proxy.
    ports:
      - "${TUBESY_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Owner of the download folder (run `id <user>` on the server).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Get the newest yt-dlp on every start (sites change often).
      YTDLP_AUTO_UPDATE: ${YTDLP_AUTO_UPDATE:-true}
      # Reverse proxies in Docker networks may send X-Forwarded-* (real client IP, HTTPS).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      # Optional: create the administrator without the setup wizard.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${DOWNLOAD_PATH:-./downloads}:/downloads
